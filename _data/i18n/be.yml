index:
  hero_before: Незалежны фінансавы інструмент
  hero_accent: доўгатэрміновай
  hero_after: падтрымкі
  about_header: Пра Hexagonby
  about_text: >-
    Hexagonby — гэта эндаўмент-фонд, які працуе на доўгатэрміновую перспектыву.
    Мы не разлічваем на гранты і знешняе фінансаванне, а ствараем фінансавую аснову,
    якая дазволіць падтрымліваць важныя ініцыятывы незалежна ад эканамічных крызісаў
    і палітычнай сітуацыі.
  card1_header: Наш падыход
  card1_text: >-
    Мы арыентуемся на празрыстасць і эфектыўнасць. У адрозненне ад класічных
    дабрачынных арганізацый, якія часта залежаць ад перыядычных ахвяраванняў,
    наш фонд пабудаваны так, каб быць самадастатковым. Мы клапоцімся пра тое,
    каб кожны ахвяраваны даляр працаваў не разава, а прыносіў даход на доўгія гады.
  card2_header: Прынцыпы Hexagonby
  card2_p1: >-
    Незалежнасць — мы не будзем залежаць ад грантаў і знешніх фінансавых плыняў.
  card2_p2: >-
    Доўгатэрміновасць — наш фонд пабудаваны так, каб працаваць дзесяцігоддзямі.
  card2_p3: >-
    Разумнае інвеставанне — сродкі размяркоўваюцца максімальна бяспечна,
    з улікам доўгатэрміновага росту.
  card3_header: Нашы мэты і бачанне
  card3_text: >-
    Мы ствараем фінансавы механізм, які дазволіць устойліва падтрымліваць
    ініцыятывы і не залежаць ад вонкавых умоў. У кароткатэрміновай перспектыве
    мы фарміруем першасны капітал і наладжваем празрысты механізм інвеставання.
    Далей мы плануем павялічваць капітал фонду і пашыраць колькасць праектаў,
    якія могуць разлічваць на фінансаванне ад Hexagonby.
  goal_header: Наша галоўная мэта
  goal_text: >-
    Стварыць скарбонку, якая будзе працаваць заўсёды, незалежна ад
    знешніх фактараў.
  how_header: Як гэта працуе
  how_p1: >-
    Эндаўмент-фонд (англ. endowment) — гэта фінансавы інструмент
    доўгатэрміновай падтрымкі, які дазваляе арганізацыі стабільна
    функцыянаваць і рэалізоўваць сваю місію на працягу многіх гадоў.
  how_p2: >-
    Галоўны прынцып эндаўмента — захаванне асноўнага капіталу і
    выкарыстанне даходу ад яго інвеставання.
  how_card1_title: Фарміраванне капіталу
  how_card1_text: >-
    Фонд атрымлівае ахвяраванні ад дабрачынцаў, арганізацый або
    іншых крыніц.
  how_card2_title: Інвеставанне сродкаў
  how_card2_text: >-
    Сродкі размяшчаюцца ў надзейныя фінансавыя інструменты (акцыі,
    аблігацыі, фонды і інш.), што дазваляе атрымліваць стабільны
    прыбытак.
  how_card3_title: Выкарыстанне даходу
  how_card3_text: >-
    Толькі даход ад інвестыцый выкарыстоўваецца для фінансавання
    праектаў і ініцыятыў, у той час як асноўны капітал застаецца
    недатыкальным.
  how_card4_title: Доўгатэрміновы эфект
  how_card4_text: >-
    Дзякуючы такому падыходу фонд можа існаваць на працягу
    дзесяцігоддзяў, забяспечваючы фінансавую стабільнасць і
    бесперапынную падтрымку ініцыятыў.
  uni_text: >-
    Эндаўмент-фонды шырока распаўсюджаны ў свеце. Паводле такой схемы
    працуюць шматлікія арганізацыі ад найлепшых заходніх універсітэтаў
    (Стэнфард, Кембрыдж) да Чырвонага крыжа.
  support_header: Падтрымаць Hexagonby
  support_subscribe: Падпіска
  support_once: Разавая падтрымка
